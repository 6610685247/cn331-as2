name: Unit Tests

on:
  push:
    branches:
      - testing  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3      
      - uses: actions/setup-python@v4  
        with:
          python-version: "3.11"

      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
          coverage run manage.py test
          coverage report
